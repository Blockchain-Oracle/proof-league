# CI on every push (AD-12): check + build, green from the first commit. Focused contract and
# conformance checks are added only by the implementation slice that justifies them.
name: ci
on:
  push:
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @proof-league/shared run selftest
      # Freshness gate [review 2026-09-02]: the committed conformance vectors must be the
      # generator's current output, or both planes would pass against a stale fixture.
      - run: pnpm --filter @proof-league/shared exec tsx src/eip712-vectors.gen.ts
      - run: git diff --exit-code packages/shared/src/eip712-vectors.json
      - run: pnpm check
      - run: pnpm build
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge build
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts
