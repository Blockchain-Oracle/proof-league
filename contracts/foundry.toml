# solc 0.8.28 exact (spine Stack table). evm_version is PROVISIONAL until day-1 spike gate 6
# confirms which target verifies on creditcoin-testnet.blockscout.com — pinned same-day.
[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# forge-std ships code under src/; the explicit remapping keeps the canonical
# "forge-std/Test.sol" import path (auto-remap would point at the package root).
remappings = ["forge-std/=node_modules/forge-std/src/"]
