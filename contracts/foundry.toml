# solc 0.8.28 exact (spine Stack table). evm_version paris CONFIRMED by spike gate 6
# 2026-09-02: SpikeProbe 0x8334889B9c068e57078Da3376087ee2b7A7fd42B "Pass - Verified" on
# creditcoin-testnet.blockscout.com with this exact profile.
[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# forge-std ships code under src/; the explicit remapping keeps the canonical
# "forge-std/Test.sol" import path (auto-remap would point at the package root).
remappings = ["forge-std/=node_modules/forge-std/src/"]
# Read-only, single-file: the EIP-712 conformance suite re-derives the shared vectors (AD-5).
fs_permissions = [{ access = "read", path = "../packages/shared/src/eip712-vectors.json" }]
