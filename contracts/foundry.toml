# solc 0.8.28 exact (spine Stack table). evm_version paris CONFIRMED by spike gate 6
# 2026-09-02: SpikeProbe 0x8334889B9c068e57078Da3376087ee2b7A7fd42B "Pass - Verified" on
# creditcoin-testnet.blockscout.com with this exact profile.
[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Required by the vendored @gluwa/usc-contracts EvmV1Decoder (Story 2.3): its nested
# receipt abi.decode is stack-too-deep on the legacy pipeline in ANY consumer. via_ir is
# part of the standard-JSON verification metadata, so Blockscout verification carries it;
# the spike-confirmed evm_version/solc pins above are unchanged.
via_ir = true
# forge-std ships code under src/; the explicit remapping keeps the canonical
# "forge-std/Test.sol" import path (auto-remap would point at the package root).
remappings = ["forge-std/=node_modules/forge-std/src/"]
# Read-only, per-fixture: the conformance suites re-derive the shared vectors — EIP-712
# leaves (AD-5) and the outcome bucket map (AD-8) — from the same files the TS mirrors use.
fs_permissions = [
    { access = "read", path = "../packages/shared/src/eip712-vectors.json" },
    { access = "read", path = "../packages/shared/src/outcome-vectors.json" },
    { access = "read", path = "../packages/shared/src/pickset-vectors.json" },
]
